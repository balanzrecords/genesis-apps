<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interact with Langflow</title>
</head>
<body>
  <div style="max-width: 600px; margin: 2rem auto;">
    <h2 style="text-align:center">Langflow App</h2>
    <textarea id="input" rows="4" style="width:100%; padding:1rem; font-size:1rem; border-radius:5px; border:1px solid #ccc; resize:none;" placeholder="Escribe tu mensaje..."></textarea>
    <button id="submit" style="display:block; margin:1rem auto; padding:0.75rem 2rem; font-size:1rem; border:none; border-radius:5px; background:#007BFF; color:white; cursor:pointer;">Enviar</button>
    <pre id="output" style="background:#f5f5f5; padding:1rem; border-radius:5px; white-space:pre-wrap; word-wrap:break-word; margin-top:1rem;"></pre>
  </div>
</body>
</html>
