<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora Básica</title>
<style>
body {font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0;}
.calculator {background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
.display {width: 100%; height: 40px; font-size: 1.5em; text-align: right; margin-bottom: 10px; padding: 5px; border: 1px solid #ccc; border-radius: 5px;}
.buttons {display: grid; grid-template-columns: repeat(4, 60px); gap: 10px;}
button {font-size: 1.2em; padding: 10px; border: none; border-radius: 5px; background: #e0e0e0; cursor: pointer;}
button.operator {background: #ff9500; color: #fff;}
button.equal {grid-column: span 2; background: #34c759; color: #fff;}
</style>
</head>
<body>
<div class="calculator">
<input type="text" id="display" class="display" readonly/>
<div class="buttons">
<button class="operator" data-value="+">+</button>
<button class="operator" data-value="-">-</button>
<button class="operator" data-value="*">×</button>
<button class="operator" data-value="/">÷</button>
<button data-value="7">7</button>
<button data-value="8">8</button>
<button data-value="9">9</button>
<button class="operator" data-value="%">%</button>
<button data-value="4">4</button>
<button data-value="5">5</button>
<button data-value="6">6</button>
<button class="operator" data-value="^">^</button>
<button data-value="1">1</button>
<button data-value="2">2</button>
<button data-value="3">3</button>
<button class="equal" id="equals">=</button>
<button data-value="0" style="grid-column: span 2;">0</button>
<button data-value=".">.</button>
<button id="clear">C</button>
</div>
</div>
<script>
const display = document.getElementById("display");
const buttons = document.querySelectorAll("button[data-value]");
buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    display.value += btn.getAttribute("data-value");
  });
});

document.getElementById("clear").addEventListener("click", () => { display.value = ""; });

document.getElementById("equals").addEventListener("click", () => {
  try {
    let expr = display.value.replace(/÷/g, '/').replace(/×/g, '*');
    expr = expr.replace(/\^/g, '**');
    const result = eval(expr);
    display.value = result;
  } catch (e) {
    display.value = "Error";
  }
});
</script>
</body>
</html>
