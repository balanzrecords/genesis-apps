<!DOCTYPE html>
<html>
<head>
    <title>Langflow App</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        textarea { width: 100%; height: 100px; margin: 1rem 0; }
        button { padding: 0.7rem 1.5rem; }
        .response { margin-top: 1.5rem; padding: 1rem; background: #f0f0f0; }
    </style>
</head>
<body>
    <h2>Interact with Langflow</h2>
    <textarea id="input" placeholder="Escribe tu consulta..."></textarea>
    <button onclick="sendRequest()">Enviar</button>
    <div class="response" id="output"></div>

    <script>
        async function sendRequest() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            
            output.innerHTML = 'Enviando...';
            
            try {
                const response = await fetch('https://balanzrecords-genesis-arz.hf.space/flow/d7a08443-ca6a-421f-8632-c8bd11ff6227/folder/06b31f9a-b238-40c4-b149-11ee72efe7b5', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer sk-jid5j0osCmdKgqKhZDxqtpKbzeVwFk8T0tvRZDU8mI4',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ input })
                });

                const data = await response.json();
                output.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                output.innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
