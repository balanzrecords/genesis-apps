<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gigi</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1e1e1e;
      padding: 1rem;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .msg {
      max-width: 80%;
      margin: 0.5rem 0;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg-user {
      background: #0d6efd;
      align-self: flex-end;
      color: #fff;
    }
    .msg-gigi {
      background: #2c2c2c;
      align-self: flex-start;
      color: #e0e0e0;
    }
    #input-area {
      display: flex;
      padding: 0.5rem;
      background: #1e1e1e;
    }
    #msg {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 4px;
      margin-right: 0.5rem;
    }
    #send {
      background: #0d6efd;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <header>Gigi</header>
  <div id="chat" class="chat"></div>
  <div id="input-area">
    <input type="text" id="msg" placeholder="Escribe un mensaje..." />
    <button id="send">Enviar</button>
  </div>
  <script>
    const apiUrl = "https://balanzrecords-genesis-arz.hf.space/api/v1/run/d7a08443-ca6a-421f-8632-c8bd11ff6227";
    const chat = document.getElementById('chat');
    const input = document.getElementById('msg');
    const sendBtn = document.getElementById('send');

    function addMessage(text, className) {
      const div = document.createElement('div');
      div.className = 'msg ' + className;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const userMsg = input.value.trim();
      if (!userMsg) return;
      addMessage(userMsg, 'msg-user');
      input.value = '';
      try {
        const resp = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', "x-api-key": "sk-jid5j0osCmdKgqKhZDxqtpKbzeVwFk8T0tvRZDU8mI4"},
          body: JSON.stringify({ input_value: userMsg, input_type: 'chat', output_type: 'chat' })
        });
        const data = await resp.json();
        const gigiMsg = data?.outputs?.[0]?.outputs?.[0]?.results?.message?.text || 'Sin respuesta';
        addMessage(gigiMsg, 'msg-gigi');
      } catch (e) {
        addMessage('Error de conexión', 'msg-gigi');
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
